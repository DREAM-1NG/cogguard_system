# =============================================================================
# CogGuard 基础服务编排
#
# 包含三个核心依赖服务：MySQL（结构化存储）、MongoDB（非结构化存储）、Redis（缓存/队列）
# 使用方式：docker compose up -d
# 停止服务：docker compose down（保留数据）/ docker compose down -v（清除数据）
# =============================================================================

services:
  # ---------- MySQL 8.0 ----------
  # 存储：用户、任务、告警、案例等结构化数据
  # 默认端口：3306
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: cogguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cogguard123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cogguard}
      MYSQL_USER: ${MYSQL_USER:-cogguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cogguard123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-cogguard123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MongoDB 7.0 ----------
  # 存储：爬取的帖子、评论、账户画像等非结构化数据
  # 默认端口：27017
  mongodb:
    image: docker.m.daocloud.io/library/mongo:7.0
    container_name: cogguard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cogguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cogguard123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-cogguard}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./docker-data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis 7 ----------
  # 用途：缓存、会话管理、Celery 任务队列的 Broker 和 Backend
  # 默认端口：6379
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: cogguard-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cogguard123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cogguard123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

# 持久化数据改为项目目录挂载，便于隔离、备份和清理
# 首次启动前可按需创建：mkdir -p docker-data/mysql docker-data/mongo docker-data/redis
