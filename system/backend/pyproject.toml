[project]
name = "cogguard-backend"
version = "0.1.0"
description = "CogGuard - Intelligent Joint Defense System for Cross-domain Cognitive Manipulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiomysql>=0.2.0",
    "motor>=3.5.0",
    "redis[hiredis]>=5.0.0",
    "celery[redis]>=5.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pymysql>=1.1.0",
    "email-validator>=2.0.0",
    "pandas>=2.2.0",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "python-igraph>=0.11.0,<0.12.0",
    "leidenalg>=0.10.0,<0.11.0",
    "torch>=2.3.0,<3.0.0",
    "torch-geometric>=2.5.0,<3.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
