# =============================================================================
# CogGuard 基础服务编排
#
# 包含三个核心依赖服务：MySQL（结构化存储）、MongoDB（非结构化存储）、Redis（缓存/队列）
# 使用方式：docker compose up -d
# 停止服务：docker compose down（保留数据）/ docker compose down -v（清除数据）
# =============================================================================

services:
  # ---------- MySQL 8.0 ----------
  # 存储：用户、任务、告警、案例等结构化数据
  # 默认端口：3306
  mysql:
    image: mysql:8.0
    container_name: cogguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cogguard}
      MYSQL_USER: ${MYSQL_USER:-cogguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- MongoDB 7.0 ----------
  # 存储：爬取的帖子、评论、账户画像等非结构化数据
  # 默认端口：27017
  mongodb:
    image: mongo:7.0
    container_name: cogguard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cogguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-cogguard}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./ops/mongo:/opt/cogguard-ops:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Redis 7 ----------
  # 用途：缓存、会话管理、Celery 任务队列的 Broker 和 Backend
  # 默认端口：6379
  redis:
    image: redis:7-alpine
    container_name: cogguard-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Production static frontend ----------
  # Opt-in profile. The backend remains the existing host process by default.
  frontend_static:
    profiles: ["production-ui"]
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    container_name: cogguard-frontend
    restart: unless-stopped
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://host.docker.internal:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# 持久化数据卷，docker compose down 时保留数据
# 使用 docker compose down -v 可清除
volumes:
  mysql_data:
  mongo_data:
  redis_data:
